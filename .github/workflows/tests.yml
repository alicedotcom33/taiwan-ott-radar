name: Node tests
on:
  push:
    branches: [feature/highlights-wetv-20261016]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm test
      - run: node scripts/check-wetv-home.mjs
